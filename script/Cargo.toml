[package]
version = "0.1.0"
name = "zkapp-script"
edition = "2021"
default-run = "zkapp"

[[bin]]
name = "zkapp"
path = "src/bin/main.rs"

[dependencies]
sp1-sdk         = { version = "6.1.0", features = ["blocking", "native-gnark", "profiling", "cuda","network"] }
sp1-core-executor = "6.1.0"
sp1-core-executor-runner = "6.1.0"
tokio           = { version = "1", features = ["full"] }
clap            = { version = "4.0", features = ["derive", "env"] }
dotenv          = "0.15.0"
bincode = { workspace = true }
anyhow            = { workspace = true }
hex               = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
zeko_sp1_lib      = { path = "../lib" }
pickles-verifier = { path = "../crates/pickles-verifier" }

[dev-dependencies]
alloy-primitives = { version = "=0.8.20", features = ["sha3-keccak"] }
criterion = "0.5"

[build-dependencies]
sp1-build = "6.1.0"
