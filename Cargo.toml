[workspace]
members = [
    "api",
    "crates/pickles-verifier",
    "lib",
    "program/settlement",
    "program/bridge",
    "program/withdraw",
    "script"
]
exclude = [
    "vendor/algebra/ec",
    "vendor/algebra/ff",
    "vendor/algebra/ff-asm",
    "vendor/algebra/ff-macros",
    "vendor/algebra/poly",
    "vendor/algebra/serialize",
    "vendor/algebra/serialize-derive",
    "vendor/proof-systems/curves",
    "vendor/proof-systems/groupmap",
    "vendor/proof-systems/hasher",
    "vendor/proof-systems/internal-tracing",
    "vendor/proof-systems/kimchi",
    "vendor/proof-systems/msm",
    "vendor/proof-systems/poly-commitment",
    "vendor/proof-systems/poseidon",
    "vendor/proof-systems/utils",
]
resolver = "2"

[profile.release]
lto            = "thin"
codegen-units  = 1
opt-level      = 3

[workspace.dependencies]
# ark
ark-ec          = { version = "0.5.0", features = ["std"] }
ark-ff          = { version = "0.5.0", features = ["std"] }
ark-serialize   = { version = "0.5.0", features = ["std"] }
ark-poly        = { version = "0.5.0", features = ["std"] }

# proof-systems — local SP1 PoC patches
kimchi          = { path = "vendor/proof-systems/kimchi" }
mina-curves     = { path = "vendor/proof-systems/curves" }
mina-poseidon   = { path = "vendor/proof-systems/poseidon" }
o1-utils        = { path = "vendor/proof-systems/utils" }
poly-commitment = { path = "vendor/proof-systems/poly-commitment" }
groupmap        = { path = "vendor/proof-systems/groupmap" }

# misc
alloy-sol-types = "1.0"
anyhow          = "1.0.81"
bincode         = "1.3.3"
bytemuck        = "1"
hex             = "0.4.3"
serde           = { version = "1", features = ["derive", "rc"] }
serde_json      = "1.0.107"

[patch."https://github.com/o1-labs/proof-systems"]
kimchi          = { path = "vendor/proof-systems/kimchi" }
mina-curves     = { path = "vendor/proof-systems/curves" }
mina-poseidon   = { path = "vendor/proof-systems/poseidon" }
o1-utils        = { path = "vendor/proof-systems/utils" }
poly-commitment = { path = "vendor/proof-systems/poly-commitment" }

[patch."https://github.com/zeko-labs/proof-systems"]
kimchi          = { path = "vendor/proof-systems/kimchi" }
mina-curves     = { path = "vendor/proof-systems/curves" }
mina-poseidon   = { path = "vendor/proof-systems/poseidon" }
o1-utils        = { path = "vendor/proof-systems/utils" }
poly-commitment = { path = "vendor/proof-systems/poly-commitment" }

[patch."https://github.com/zeko-labs/algebra"]
ark-ff        = { path = "vendor/algebra/ff" }
ark-ec        = { path = "vendor/algebra/ec" }
ark-serialize = { path = "vendor/algebra/serialize" }
ark-poly      = { path = "vendor/algebra/poly" }

[patch.crates-io]
crypto-bigint = { git = "https://github.com/sp1-patches/RustCrypto-bigint", tag = "patch-0.5.5-sp1-6.0.0" }
ark-ff        = { path = "vendor/algebra/ff" }
ark-ec        = { path = "vendor/algebra/ec" }
ark-serialize = { path = "vendor/algebra/serialize" }
ark-poly      = { path = "vendor/algebra/poly" }
