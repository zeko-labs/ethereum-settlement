[workspace]
members = [
    "api",
    "crates/pickles-verifier",
    "lib",
    "program/settlement",
    "program/bridge",
    "program/withdraw",
    "script"
]
exclude = [
    "vendor/algebra/ec",
    "vendor/algebra/ff",
    "vendor/algebra/ff-asm",
    "vendor/algebra/ff-macros",
    "vendor/algebra/poly",
    "vendor/algebra/serialize",
    "vendor/algebra/serialize-derive",
    "vendor/proof-systems/curves",
    "vendor/proof-systems/groupmap",
    "vendor/proof-systems/hasher",
    "vendor/proof-systems/internal-tracing",
    "vendor/proof-systems/kimchi",
    "vendor/proof-systems/msm",
    "vendor/proof-systems/poly-commitment",
    "vendor/proof-systems/poseidon",
    "vendor/proof-systems/utils",
]
resolver = "2"

[profile.release]
lto            = "thin"
codegen-units  = 1
opt-level      = 3

[workspace.dependencies]
# ark
ark-ec          = { version = "0.5.0", default-features = false }
ark-ff          = { version = "0.5.0", default-features = false }
ark-serialize   = { version = "0.5.0", default-features = false }
ark-poly        = { version = "0.5.0", default-features = false }

# proof-systems — upstream o1-labs, branch `sp1-on-master` (NOT merged into
# master: the SP1 work is maintained on top of it). The `sys_bigint` precompile
# lives in mina-curves' `sp1` feature there, so no arkworks fork is needed.
# The exact commit is pinned in Cargo.lock (versioned), so builds stay
# reproducible; `cargo update` is what moves us to the branch's head.
kimchi          = { git = "https://github.com/o1-labs/proof-systems", branch = "sp1-on-master", default-features = false }
mina-curves     = { git = "https://github.com/o1-labs/proof-systems", branch = "sp1-on-master", default-features = false }
mina-poseidon   = { git = "https://github.com/o1-labs/proof-systems", branch = "sp1-on-master", default-features = false }
o1-utils        = { git = "https://github.com/o1-labs/proof-systems", branch = "sp1-on-master", default-features = false }
poly-commitment = { git = "https://github.com/o1-labs/proof-systems", branch = "sp1-on-master", default-features = false }
groupmap        = { git = "https://github.com/o1-labs/proof-systems", branch = "sp1-on-master", default-features = false }

# SP1 — one source of truth. Must match what proof-systems@sp1-on-master pins:
# crates.io and git are distinct crates to cargo even at the same version, and
# two sp1-zkvm copies each register a `#[global_allocator]`.
sp1-zkvm                 = { git = "https://github.com/succinctlabs/sp1", tag = "v6.2.2" }
sp1-lib                  = { git = "https://github.com/succinctlabs/sp1", tag = "v6.2.2" }
sp1-sdk                  = { git = "https://github.com/succinctlabs/sp1", tag = "v6.2.2" }
sp1-build                = { git = "https://github.com/succinctlabs/sp1", tag = "v6.2.2" }
sp1-core-executor        = { git = "https://github.com/succinctlabs/sp1", tag = "v6.2.2" }
sp1-core-executor-runner = { git = "https://github.com/succinctlabs/sp1", tag = "v6.2.2" }

# misc
alloy-sol-types = "1.0"
anyhow          = "1.0.81"
bincode         = "1.3.3"
bytemuck        = "1"
hex             = "0.4.3"
serde           = { version = "1", features = ["derive", "rc"] }
serde_json      = "1.0.107"

[patch.crates-io]
crypto-bigint = { git = "https://github.com/sp1-patches/RustCrypto-bigint", tag = "patch-0.5.5-sp1-6.0.0" }
