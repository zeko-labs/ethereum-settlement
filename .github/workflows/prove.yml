name: Build Program

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Build and Execute
    runs-on:
      - runs-on
      - runner=16cpu-linux-x64
      - run-id=${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.92

      - name: Install SP1 toolchain
        run: |
          curl -L https://sp1.succinct.xyz | bash
          ~/.sp1/bin/sp1up --version v6.1.0
          ~/.sp1/bin/cargo-prove prove --version

      - name: Build SP1 program
        run: |
          ~/.sp1/bin/cargo-prove prove build --docker --tag v6.1.0 --locked \
            --rustflags=-C,passes=lower-atomic \
            -p settlement-program -p bridge-program -p withdraw-program

      - name: Run Rust tests
        run: |
          cargo test --locked -p bridge-program -p withdraw-program -p zeko_sp1_lib
